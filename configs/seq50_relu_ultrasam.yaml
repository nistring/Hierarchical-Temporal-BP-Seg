# seq50 with ReLU activation + UltraSam labels (unweighted CE, paper standard)
# Used to back the deployment paragraph: ReLU variant evaluated under the same
# UltraSam protocol as the GeLU baseline (r15_noweights_ultrasam).
trainer:
  max_epochs: 20
  gpus: [0,1,2,3]
  ckpt_path: null

model:
  encoder_name: 'mit_b0'
  segmentation_model_name: 'Segformer'
  temporal_model: 'ConvLSTM'
  conv_type: "depthwise"
  num_classes: 8
  freeze_encoder: false
  num_layers: 1
  kernel_size: [3, 3]
  dilation: 1
  encoder_depth: 5
  temporal_depth: 4
  model_kwargs:
    decoder_segmentation_channels: 256
  learning_rate: 1.0e-3
  image_size: [416, 416]
  ce_weight: 0.5
  temporal_loss_weight: 5
  exclusion_weight: 5
  positive_weight: 5
  negative_weight: 5
  # ce_class_weights intentionally omitted (unweighted, paper standard).
  use_relu: true

data:
  train:
    data_path: './data/SUIT/images/sonosite_train'
    annotations_path: './data/SUIT/coco_annotations/sonosite_train_ultrasam.json'
    sequence_length: 50
    batch_size: 2
    truncated_bptt_steps: 10
  val:
    data_path: './data/SUIT/images/sonosite_val'
    annotations_path: './data/SUIT/coco_annotations/sonosite_val_ultrasam.json'
    sequence_length: 50
    batch_size: 2
    truncated_bptt_steps: 10
  num_workers: 12

logging:
  monitor: 'val_loss'
  mode: 'min'
