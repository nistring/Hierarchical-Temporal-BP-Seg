# seq50 with UltraSam-generated labels (compare against seq50 with SAM2 labels)
trainer:
  max_epochs: 20
  gpus: [0,1,2,3]
  ckpt_path: null

model:
  # Model name
  encoder_name: 'mit_b0'
  segmentation_model_name: 'Segformer'
  temporal_model: 'ConvLSTM'
  conv_type: "depthwise"
  # Model parameters
  num_classes: 8
  freeze_encoder: false
  num_layers: 1
  kernel_size: [3, 3]
  dilation: 1
  encoder_depth: 5
  temporal_depth: 4
  model_kwargs:
    decoder_segmentation_channels: 256
  # Training parameters
  learning_rate: 1.0e-3
  image_size: [416, 416]
  # Loss weights
  ce_weight: 0.5
  temporal_loss_weight: 5
  exclusion_weight: 5
  positive_weight: 5
  negative_weight: 5
  # Class-balanced CE weights: [BG, C5, C6, C7/MT, C8/LT, UT, SSN, AD, PD]
  # Foreground weights are inverse pixel-frequency normalized (mean=1), BG fixed at 1.0
  ce_class_weights: [1.0, 0.9417, 0.9339, 0.2813, 0.67, 0.2939, 3.5373, 0.7559, 0.586]
data:
  train:
    data_path: './data/SUIT/images/sonosite_train'
    annotations_path: './data/SUIT/coco_annotations/sonosite_train_ultrasam.json'
    sequence_length: 50
    batch_size: 2
    truncated_bptt_steps: 10
  val:
    data_path: './data/SUIT/images/sonosite_val'
    annotations_path: './data/SUIT/coco_annotations/sonosite_val_ultrasam.json'
    sequence_length: 50
    batch_size: 2
    truncated_bptt_steps: 10
  num_workers: 12

logging:
  monitor: 'val_loss'
  mode: 'min'
