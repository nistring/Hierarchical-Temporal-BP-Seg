# EGE-UNet (MICCAI 2023) — lightweight medical-segmentation baseline.
# Trained at the same 416^2 input resolution as our method. Loss recipe is
# segmentation-only (Tversky + CE + deep-supervision aux BCE on the paper's
# `gt_pre1..gt_pre5` heads). Temporal/contrastive/exclusion losses are
# disabled because they belong to the proposed temporal-fusion framework
# and applying them to a per-frame baseline would be an unfair handicap.
trainer:
  max_epochs: 20
  gpus: [0, 1, 2, 3]
  ckpt_path: null

model:
  # baseline:* dispatch bypasses TemporalSegmentationModel.
  segmentation_model_name: 'baseline:ege_unet'
  # Required keys (validated by main.py; the baseline ignores them):
  encoder_name: 'mit_b0'
  temporal_model: 'ConvLSTM'
  conv_type: 'depthwise'
  num_classes: 8
  freeze_encoder: false
  num_layers: 1
  kernel_size: [3, 3]
  dilation: 1
  encoder_depth: 5
  temporal_depth: 0
  # Training parameters
  learning_rate: 1.0e-3
  image_size: [416, 416]
  # Segmentation-only loss recipe; aux DS BCE is added automatically when
  # the model exposes `aux_sigmoids` (see SegmentationTrainer.compute_loss).
  ce_weight: 0.5
  temporal_loss_weight: 0
  exclusion_weight: 0
  positive_weight: 0
  negative_weight: 0

data:
  train:
    data_path: './data/SUIT/images/sonosite_train'
    annotations_path: './data/SUIT/coco_annotations/sonosite_train_ultrasam.json'
    sequence_length: 50
    batch_size: 2
    truncated_bptt_steps: 10
  val:
    data_path: './data/SUIT/images/sonosite_val'
    annotations_path: './data/SUIT/coco_annotations/sonosite_val_ultrasam.json'
    sequence_length: 50
    batch_size: 2
    truncated_bptt_steps: 10
  num_workers: 12

logging:
  monitor: 'val_loss'
  mode: 'min'
